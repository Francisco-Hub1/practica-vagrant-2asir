services:
  # =========================
  # HADOOP - NODO 1
  # =========================
  namenode:
    profiles: ["nodo1"]
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    network_mode: host
    env_file:
      - ./hadoop.env
    extra_hosts:
      - "nodo1:192.168.56.10"
      - "nodo2:192.168.56.11"
      - "nodo3:192.168.56.12"
    volumes:
      - /opt/bigdata/namenode:/data/dfs/name
    command:
      - /bin/bash
      - -c
      - |
        if [ ! -f /data/dfs/name/current/VERSION ]; then
          hdfs namenode -format -nonInteractive
        fi
        exec hdfs namenode
    restart: unless-stopped

  # =========================
  # SPARK - MASTER
  # =========================
  spark-master:
    profiles: ["nodo1"]
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    hostname: spark-master
    extra_hosts:
      - "spark-master:192.168.56.10"
    network_mode: host
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - 192.168.56.10
      - --port
      - "7077"
      - --webui-port
      - "8080"
    volumes:
      - /opt/bigdata/reparto.py:/opt/spark-app/reparto.py:ro
      - ./monitoring/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    restart: unless-stopped

  # =========================
  # HADOOP - NODO 2
  # =========================
  datanode1:
    profiles: ["nodo2"]
    image: apache/hadoop:3.3.6
    container_name: datanode1
    hostname: datanode1
    network_mode: host
    env_file:
      - ./hadoop.env
    environment:
      HDFS-SITE.XML_dfs.datanode.hostname: "192.168.56.11"
    volumes:
      - datanode1-data:/data/dfs/data
    command: ["hdfs", "datanode"]
    restart: unless-stopped

  spark-worker1:
    profiles: ["spark-worker1-manual"]
    image: apache/spark:3.5.3-python3
    container_name: spark-worker1
    hostname: spark-worker1
    extra_hosts:
      - "spark-worker1:192.168.56.11"
      - "spark-master:192.168.56.10"
    network_mode: host
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://192.168.56.10:7077
      - --host
      - 192.168.56.11
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --memory
      - 1g
      - --cores
      - "1"
    volumes:
      - ./monitoring/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    restart: unless-stopped

  # =========================
  # HADOOP - NODO 3
  # =========================
  datanode2:
    profiles: ["nodo3"]
    image: apache/hadoop:3.3.6
    container_name: datanode2
    hostname: datanode2
    network_mode: host
    env_file:
      - ./hadoop.env
    environment:
      HDFS-SITE.XML_dfs.datanode.hostname: "192.168.56.12"
    volumes:
      - datanode2-data:/data/dfs/data
    command: ["hdfs", "datanode"]
    restart: unless-stopped

  spark-worker2:
    profiles: ["spark-worker2-manual"]
    image: apache/spark:3.5.3-python3
    container_name: spark-worker2
    hostname: spark-worker2
    extra_hosts:
      - "spark-worker2:192.168.56.12"
      - "spark-master:192.168.56.10"
    network_mode: host
    environment:
      SPARK_CONF_DIR: /opt/spark/conf
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://192.168.56.10:7077
      - --host
      - 192.168.56.12
      - --port
      - "7079"
      - --webui-port
      - "8082"
      - --memory
      - 1g
      - --cores
      - "1"
    volumes:
      - ./monitoring/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    restart: unless-stopped

  # =========================
  # NODE EXPORTER - LOS 3 NODOS
  # =========================
  node-exporter-nodo1:
    profiles: ["nodo1"]
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-nodo1
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  node-exporter-nodo2:
    profiles: ["nodo2"]
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-nodo2
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  node-exporter-nodo3:
    profiles: ["nodo3"]
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-nodo3
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  # =========================
  # CADVISOR - LOS 3 NODOS
  # =========================
  cadvisor-nodo1:
    profiles: ["nodo1"]
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor-nodo1
    network_mode: host
    privileged: true
    command:
      - --port=8085
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  cadvisor-nodo2:
    profiles: ["nodo2"]
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor-nodo2
    network_mode: host
    privileged: true
    command:
      - --port=8085
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  cadvisor-nodo3:
    profiles: ["nodo3"]
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor-nodo3
    network_mode: host
    privileged: true
    command:
      - --port=8085
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  # =========================
  # EXPORTER HDFS
  # =========================
  hdfs-exporter:
    profiles: ["nodo1"]
    image: python:3.12.8-slim
    container_name: hdfs-exporter
    command: ["python", "/app/hdfs-exporter.py"]
    volumes:
      - ./monitoring/hdfs-exporter.py:/app/hdfs-exporter.py:ro
    networks:
      - monitoring
    restart: unless-stopped

  # =========================
  # PROMETHEUS
  # =========================
  prometheus:
    profiles: ["nodo1"]
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped

  # =========================
  # GRAFANA
  # =========================
  grafana:
    profiles: ["nodo1"]
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

  # =========================
  # ALERTMANAGER
  # =========================
  alertmanager:
    profiles: ["nodo1"]
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  datanode1-data:
  datanode2-data:
  prometheus-data:
  grafana-data:
  alertmanager-data: