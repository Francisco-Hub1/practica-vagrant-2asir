services:
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    env_file: ./hadoop.env
    command: ["/bin/bash","-c","hdfs namenode -format -nonInteractive && hdfs namenode"]
    ports: ["9870:9870"]

  datanode1:
    image: apache/hadoop:3.3.6
    container_name: datanode1
    hostname: datanode1
    env_file: ./hadoop.env
    command: ["hdfs","datanode"]
    depends_on: [namenode]

  datanode2:
    image: apache/hadoop:3.3.6
    container_name: datanode2
    hostname: datanode2
    env_file: ./hadoop.env
    command: ["hdfs","datanode"]
    depends_on: [namenode]

  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.master.Master"]
    ports: ["8080:8080"]

  spark-worker1:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker1
    hostname: spark-worker1
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.worker.Worker","spark://spark-master:7077","--memory","1g","--cores","1"]
    depends_on: [spark-master]

  spark-worker2:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker2
    hostname: spark-worker2
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.worker.Worker","spark://spark-master:7077","--memory","1g","--cores","1"]
    depends_on: [spark-master]