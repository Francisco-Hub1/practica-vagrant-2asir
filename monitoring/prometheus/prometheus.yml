
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter
    static_configs:
      - targets:
          - "192.168.56.10:9100"
          - "192.168.56.11:9100"
          - "192.168.56.12:9100"

  - job_name: cadvisor
    static_configs:
      - targets:
          - "192.168.56.10:8085"
          - "192.168.56.11:8085"
          - "192.168.56.12:8085"

  - job_name: hdfs
    static_configs:
      - targets:
          - "hdfs-exporter:9110"

  - job_name: spark_master
    metrics_path: /metrics/master/prometheus
    static_configs:
      - targets: ["192.168.56.10:8080"]

  - job_name: spark_worker1
    metrics_path: /metrics/worker/prometheus
    static_configs:
      - targets: ["192.168.56.11:8081"]

  - job_name: spark_worker2
    metrics_path: /metrics/worker/prometheus
    static_configs:
      - targets: ["192.168.56.12:8082"]
